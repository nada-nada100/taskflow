<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - TaskFlow</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="dashboard">
        <!-- Navbar -->
        <nav class="navbar">
            <h1>📋 TaskFlow</h1>
            <div>
                <button id="darkModeToggle">🌙 Dark</button>
                <button class="logout-btn">Logout</button>
            </div>
        </nav>

        <!-- Dashboard Content -->
        <div class="dashboard-content">
            <!-- Stats Cards -->
            <div class="stats-row">
                <div class="stat-card">
                    <h3>Total Tasks</h3>
                    <div class="number" id="totalTasks">0</div>
                </div>
                <div class="stat-card">
                    <h3>Todo</h3>
                    <div class="number" id="todoTasks">0</div>
                </div>
                <div class="stat-card">
                    <h3>In Progress</h3>
                    <div class="number" id="inProgressTasks">0</div>
                </div>
                <div class="stat-card">
                    <h3>Completed</h3>
                    <div class="number" id="completedTasks">0</div>
                </div>
            </div>

            <!-- Chart Section -->
            <div class="chart-container">
                <h2>📊 Task Overview</h2>
                <div class="chart-wrapper">
                    <canvas id="taskChart"></canvas>
                </div>
            </div>

            <!-- Add Task Form -->
            <div class="add-task-form">
                <h2>➕ Add New Task</h2>
                <form id="taskForm">
                    <div class="form-row">
                        <div class="full-width">
                            <input type="text" id="taskTitle" placeholder="Task title..." required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <input type="text" id="taskDescription" placeholder="Description (optional)">
                        </div>
                        <div>
                            <input type="text" id="taskCategory" placeholder="Category (optional)">
                        </div>
                    </div>
                    <div class="form-row">
                        <div>
                            <input type="date" id="taskDueDate">
                        </div>
                        <div>
                            <button type="submit" class="btn-primary">Add Task</button>
                        </div>
                    </div>
                </form>
            </div>

            <!-- Filter Controls -->
            <div class="filter-controls">
                <div class="filter-row">
                    <div class="filter-group">
                        <label for="statusFilter">Status:</label>
                        <select id="statusFilter">
                            <option value="">All Status</option>
                            <option value="todo">Todo</option>
                            <option value="in-progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <label for="categoryFilter">Category:</label>
                        <select id="categoryFilter">
                            <option value="">All Categories</option>
                            <option value="personal">Personal</option>
                            <option value="work">Work</option>
                            <option value="study">Study</option>
                            <option value="health">Health</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="filter-group search-group">
                        <label for="searchInput">Search:</label>
                        <input type="text" id="searchInput" placeholder="Search tasks...">
                    </div>
                </div>
            </div>

            <!-- Task List -->
            <div class="task-list">
                <h2>📝 My Tasks</h2>
                <div id="taskContainer">
                    <div class="empty-state">
                        <h3>✨ No tasks yet</h3>
                        <p>Add your first task using the form above!</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script type="module" src="js/tasks.js"></script>
    <script type="module" src="js/dark-mode.js"></script>
</body>
</html>
